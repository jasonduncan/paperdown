documentclass: article
fontsize: 11pt
papersize: letter
geometry:
  - top=1in
  - bottom=1in
  - left=1.05in
  - right=1.05in
mainfont: Palatino
sansfont: Helvetica
monofont: Menlo
linestretch: 1.12
colorlinks: true
linkcolor: NavyBlue
urlcolor: NavyBlue
subject: paperdown-report
header-includes:
  - |
    \usepackage{fancyhdr}
    \definecolor{PaperdownAccent}{HTML}{16324F}
    \definecolor{PaperdownMuted}{HTML}{5A6573}
    \definecolor{PaperdownRule}{HTML}{D7DEE8}
    \makeatletter
    \renewcommand{\maketitle}{
      \begin{flushleft}
      {\color{PaperdownAccent}\Huge\bfseries\@title\par}
      \vspace{0.7em}
      {\color{PaperdownMuted}\large\@author\par}
      {\color{PaperdownMuted}\small\@date\par}
      \end{flushleft}
      \vspace{0.9em}
      {\color{PaperdownRule}\hrule height 0.6pt}
      \vspace{1.3em}
    }
    \renewcommand\section{\@startsection{section}{1}{\z@}{-2.6ex \@plus -1ex \@minus -.2ex}{0.8ex \@plus .2ex}{\normalfont\Large\bfseries\color{PaperdownAccent}}}
    \renewcommand\subsection{\@startsection{subsection}{2}{\z@}{-2.0ex \@plus -0.8ex \@minus -.2ex}{0.6ex \@plus .2ex}{\normalfont\large\bfseries\color{PaperdownAccent}}}
    \makeatother
    \renewenvironment{quote}
      {\list{}{\leftmargin=1.4em\rightmargin=0pt}\item\relax\color{PaperdownMuted}\itshape}
      {\endlist}
    \pagestyle{fancy}
    \fancyhf{}
    \fancyfoot[C]{\color{PaperdownMuted}\thepage}
    \renewcommand{\headrulewidth}{0pt}
